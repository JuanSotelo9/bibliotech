services:
  db:
    image: postgres:16-alpine
    container_name: libreria-db
    environment:
      POSTGRES_DB: LibreriaDB
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: juan1234
    volumes:
      - db_data:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d LibreriaDB"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: libreria-backend
    depends_on:
      db:
        condition: service_healthy
    environment:
      TZ: America/Bogota
    ports:
      - "8080:8080"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: libreria-frontend
    depends_on:
      - backend
    ports:
      - "80:80"

volumes:
  db_data:
